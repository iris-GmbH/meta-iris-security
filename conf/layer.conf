# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "iris-security"
BBFILE_PATTERN_iris-security = "^${LAYERDIR}/"

LAYERSERIES_COMPAT_iris-security = "scarthgap"

LICENSE_PATH += "${LAYERDIR}/licenses"

# dynamically load required bb files, if the associated layers are available
BBFILES_DYNAMIC += " \
  freescale-layer:${LAYERDIR}/dynamic/freescale-layer/*/*/* \
"
